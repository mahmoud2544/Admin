<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Van Media — First-Time Setup</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  body { font-family: -apple-system, sans-serif; background:#0e0f12; color:#eceef2; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { max-width:420px; padding:32px; background:#17181d; border:1px solid #2a2c34; border-radius:14px; text-align:center; }
  input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #2a2c34; background:#1f2128; color:#eceef2; box-sizing:border-box; }
  button { width:100%; padding:12px; border-radius:8px; border:none; background:#5b8cff; color:white; font-weight:600; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  pre { text-align:left; background:#1f2128; padding:12px; border-radius:8px; font-size:12px; max-height:220px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="box">
    <h2>First-Time Setup</h2>
    <p style="color:#9aa0ab; font-size:13px;">
      Run this once after deploying. It copies your starter content and images
      from this deploy into Cloudflare KV/R2, so the live site and admin panel
      have something to show. Safe to run again later — it skips files
      already imported.
    </p>
    <input id="pass" type="password" placeholder="Admin password" />
    <button id="runBtn">Run Setup</button>
    <pre id="out" style="display:none;"></pre>
  </div>
  <script>
    document.getElementById('runBtn').addEventListener('click', async () => {
      const btn = document.getElementById('runBtn');
      const out = document.getElementById('out');
      const password = document.getElementById('pass').value;
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        const loginRes = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'setup', password })
        });
        const loginData = await loginRes.json();
        if (!loginRes.ok) throw new Error(loginData.error || 'Login failed');

        btn.textContent = 'Importing content and media...';
        const seedRes = await fetch('/api/seed', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + loginData.token }
        });
        const seedData = await seedRes.json();
        if (!seedRes.ok) throw new Error(seedData.error || 'Setup failed');

        out.style.display = 'block';
        out.textContent = JSON.stringify(seedData, null, 2);
        btn.textContent = 'Done — visit your site';
        btn.disabled = false;
      } catch (e) {
        out.style.display = 'block';
        out.textContent = 'Error: ' + e.message;
        btn.textContent = 'Run Setup';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
